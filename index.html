function getKoreanToday(){const p=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',year:'numeric',month:'numeric',day:'numeric'}).formatToParts(new Date());return new Date(+p.find(x=>x.type==='year').value,+p.find(x=>x.type==='month').value-1,+p.find(x=>x.type==='day').value)}function isDateWithinRecurringPeriod(d,sm,sd,em,ed){const v=(d.getMonth()+1)*100+d.getDate(),a=sm*100+sd,b=em*100+ed;return a<=b?v>=a&&v<=b:v>=a||v<=b}function formatCurrency(v){return new Intl.NumberFormat('ko-KR').format(v)+'원'}function formatPriceWithUnit(v,u){return formatCurrency(v)+'/'+u.replace('원/','')}function formatKoreanDate(d){return new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'numeric',minute:'2-digit'}).format(new Date(d))}function formatChangeRate(v){return Math.abs(v).toFixed(1)+'%'}function getTemperatureStatus(t){return t<10?['매우 차가움','두꺼운 보온 장비가 필요해요','blue']:t<15?['차가움','차가운 바다예요','blue']:t<20?['선선함','가벼운 보온이 좋아요','orange']:t<25?['적당함','활동하기 무난한 수온이에요','green']:['따뜻함','따뜻한 바다예요','red']}function getPriceTrend(current,previous){if(!previous)return{trend:'unavailable',difference:null,changeRate:null};const difference=current-previous;return{trend:difference>0?'up':difference<0?'down':'same',difference,changeRate:difference/previous*100}}
function badge(text,cls='mock'){return `<span class="badge ${cls}">${text}</span>`}function periodHTML(p){const yes=isDateWithinRecurringPeriod(getKoreanToday(),p.startMonth,p.startDay,p.endMonth,p.endDay),closed=p.type==='closed';return `<div class="line"><b>${p.label}</b>: ${p.startMonth}월 ${p.startDay}일 ~ ${p.endMonth}월 ${p.endDay}일<br>${badge(yes?'● 현재 해당 기간입니다':'○ 현재 해당 기간이 아닙니다',yes?'blue':'red')}${closed?badge(yes?'⛔ 현재 포획 금지':'✓ 현재 금어기 아님',yes?'red':'green'):badge(yes?'🐟 현재 잘 잡히는 시기':'○ 현재 주요 조업기가 아님',yes?'blue':'red')}</div>`}
function renderTemperatures(){try{const q=$('temp-search').value.trim(),sort=$('temp-sort').value;let list=beaches.filter(b=>b.name.includes(q));list.sort((a,b)=>sort==='name'?a.name.localeCompare(b.name):sort==='high'?b.temperature-a.temperature:a.temperature-b.temperature);$('temp-update').textContent='마지막 업데이트: '+formatKoreanDate(beaches[0].measuredAt)+' · Mock Data';$('temperature-list').innerHTML=list.length?list.map(b=>{const st=getTemperatureStatus(b.temperature);return `<article class="info-card"><div class="row"><div><h2>${b.name}</h2><div class="small">${b.location} · ${formatKoreanDate(b.measuredAt)}</div></div><div class="temperature">${b.temperature.toFixed(1)}℃</div></div>${badge('🌡 '+st[0],st[2])}${badge('예시 데이터','mock')}<p class="line">${st[1]}<br><span class="small">출처: ${b.source} · 마지막 업데이트 ${formatKoreanDate(b.measuredAt)}</span></p></article>`}).join(''):`<div class="empty"><b>🔎</b>조건에 맞는 데이터가 없습니다.<p><button class="action" onclick="$('temp-search').value='';renderTemperatures()">필터 초기화</button></p></div>`}catch(e){$('temperature-list').innerHTML='<div class="empty"><b>⚠️</b>수온 정보를 표시하지 못했습니다.<p><button class="action" onclick="renderTemperatures()">다시 시도</button></p></div>'}}
function refreshTemperatures(){loading('수온 정보를 불러오고 있어요');setTimeout(()=>{beaches.forEach(b=>b.temperature=Math.max(10,Math.min(28,+(b.temperature+(Math.random()-.5)*.8).toFixed(1))));hideLoading();renderTemperatures()},700)}
function renderBeachSelectors(){$('beach-chips').innerHTML=beaches.map(b=>`<button class="chip ${b.id===appState.selectedBeachId?'active':''}" aria-pressed="${b.id===appState.selectedBeachId}" onclick="appState.selectedBeachId='${b.id}';renderSeaCreatures()">${b.name.replace('해수욕장','')}</button>`).join('')}
function renderSeaCreatures(){try{renderBeachSelectors();const filters=[['all','전체'],['fish','어류'],['crustacean','갑각류'],['mollusk','연체동물'],['closed','현재 금어기'],['peak','현재 잘 잡히는 생물'],['spring','봄'],['summer','여름'],['fall','가을'],['winter','겨울']];$('creature-chips').innerHTML=filters.map(([v,n])=>`<button class="chip ${v===appState.selectedCreatureCategory?'active':''}" aria-pressed="${v===appState.selectedCreatureCategory}" onclick="appState.selectedCreatureCategory='${v}';renderSeaCreatures()">${n}</button>`).join('');const month=getKoreanToday().getMonth()+1;let list=seaCreatures.filter(c=>c.beachIds.includes(appState.selectedBeachId));const f=appState.selectedCreatureCategory;if(['fish','crustacean','mollusk'].includes(f))list=list.filter(c=>c.category===f);if(['closed','peak'].includes(f))list=list.filter(c=>c.seasonalPeriods.some(p=>p.type===f&&isDateWithinRecurringPeriod(getKoreanToday(),p.startMonth,p.startDay,p.endMonth,p.endDay)));if(['spring','summer','fall','winter'].includes(f)){const ranges={spring:[3,5],summer:[6,8],fall:[9,11],winter:[12,2]},r=ranges[f];list=list.filter(c=>c.seasonalPeriods.some(p=>p.startMonth>=r[0]&&p.startMonth<=r[1]||(f==='winter'&&(p.startMonth===12||p.startMonth<=2))));}$('creature-list').innerHTML=list.length?list.map(c=>`<article class="info-card" role="button" tabindex="0" aria-label="${c.name} 상세 보기" onclick="openCreature('${c.id}')" onkeydown="if(event.key==='Enter')openCreature('${c.id}')"><div class="row"><div><h2>🐟 ${c.name}</h2><div class="small">${c.categoryLabel} · 출현 가능성 ${c.probability}</div></div>${badge('예시 데이터','mock')}</div><p class="line">${c.habitat} · 평균 ${c.averageSize}<br>${c.characteristics[0]}</p>${c.seasonalPeriods.map(periodHTML).join('')||'<span class="small">기간 정보 확인 필요</span>'}</article>`).join(''):`<div class="empty"><b>🐠</b>조건에 맞는 생물이 없습니다.<p><button class="action" onclick="appState.selectedCreatureCategory='all';renderSeaCreatures()">필터 초기화</button></p></div>`}catch(e){$('creature-list').innerHTML='<div class="empty">⚠️ 생물 정보를 표시하지 못했습니다.</div>'}}
function openCreature(id){appState.selectedCreatureId=id;const c=seaCreatures.find(x=>x.id===id),beach=beaches.find(b=>b.id===appState.selectedBeachId);$('creature-detail').innerHTML=`<h2 class="detail-title">🐟 ${c.name}</h2>${badge('예시 데이터','mock')}<p class="subtitle">${c.scientificName}</p><article class="info-card"><h2>생물 정보</h2><p class="line">분류: ${c.categoryLabel}<br>선택한 바다: ${beach.name}<br>출현 가능성: ${c.probability}<br>주요 서식지: ${c.habitat}<br>평균/최대 크기: ${c.averageSize} / ${c.maximumSize}<br>주요 먹이: ${c.food}<br>특징: ${c.characteristics.join(' ')}</p></article><article class="info-card"><h2>기간과 포획 안내</h2>${c.seasonalPeriods.map(periodHTML).join('')||'<p class="line">기간 정보 확인 필요</p>'}<p class="line">최소 포획 체장: ${c.minimumCaptureSize}<br>식용 가능 여부: ${c.edibleStatus}<br>독성 여부: ${c.toxicity}<br>낚시 팁: ${c.fishingTips.join(' ')}</p></article><div class="warning-box">${c.warnings.join(' ')} 금어기가 아니더라도 최소 포획 체장과 지역 규정에 따라 제한될 수 있습니다.</div><p class="notice">생물의 출현 시기와 분포는 수온, 날씨, 조류 및 주변 환경에 따라 달라질 수 있습니다.</p>`;showScreen('sea-life-detail-screen')}
let cameraStream=null;function stopCamera(){if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}}function renderCamera(){stopCamera();$('camera-content').innerHTML=appState.selectedImageUrl?`<img class="preview" src="${appState.selectedImageUrl}" alt="선택한 물고기 사진 미리보기"><p class="subtitle">파일: ${escape(appState.selectedImageName)}</p><div class="button-row"><button class="action" onclick="openCamera()">다시 촬영</button><button class="action secondary" onclick="$('fish-album').click()">다른 사진 선택</button></div><div class="button-row"><button class="action secondary" onclick="removeImage()">사진 삭제</button><button class="action" onclick="analyzeFish()">물고기 분석하기</button></div>`:`<div class="camera-empty"><div style="font-size:55px">📷</div><b>사진을 촬영하거나 앨범에서 선택해 주세요.</b><div class="button-row"><button class="action" onclick="openCamera()">카메라로 촬영</button><button class="action secondary" onclick="$('fish-album').click()">앨범에서 선택</button></div></div><p class="notice">카메라는 HTTPS 또는 localhost 환경에서 지원됩니다. 제한된 브라우저에서는 앨범 선택을 이용해 주세요.</p>`}
async function openCamera(){if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$('fish-camera').click();return}try{stopCamera();cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});$('camera-content').innerHTML=`<video id="camera-preview" class="preview" autoplay playsinline muted aria-label="카메라 미리보기"></video><div class="button-row"><button class="action" onclick="capturePhoto()">● 사진 촬영</button><button class="action secondary" onclick="renderCamera()">취소</button></div>`;$('camera-preview').srcObject=cameraStream}catch(e){alert('카메라 권한을 허용할 수 없습니다. 앨범 선택을 이용하거나 브라우저 설정을 확인해 주세요.');$('fish-camera').click()}}
function capturePhoto(){const video=$('camera-preview');if(!video||!video.videoWidth)return;const canvas=document.createElement('canvas');canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0);stopCamera();canvas.toBlob(blob=>{if(!blob)return;if(appState.selectedImageUrl)URL.revokeObjectURL(appState.selectedImageUrl);appState.selectedImageUrl=URL.createObjectURL(blob);appState.selectedImageName='camera-photo.jpg';renderCamera()},'image/jpeg',.9)}
function handleImage(input){const f=input.files&&input.files[0];if(!f)return;if(appState.selectedImageUrl)URL.revokeObjectURL(appState.selectedImageUrl);appState.selectedImageUrl=URL.createObjectURL(f);appState.selectedImageName=f.name;renderCamera()}function removeImage(){if(appState.selectedImageUrl)URL.revokeObjectURL(appState.selectedImageUrl);appState.selectedImageUrl=null;appState.selectedImageName='';$('fish-camera').value='';$('fish-album').value='';renderCamera()}function loading(text){$('loading-text').textContent=text;$('loading').classList.add('show')}function hideLoading(){$('loading').classList.remove('show')}function analyzeFish(){if(!appState.selectedImageUrl)return;loading('물고기를 분석하고 있어요');setTimeout(()=>{hideLoading();renderAnalysis();showScreen('analysis-result-screen')},1500)}
function renderAnalysis(){const r={fishName:'광어',scientificName:'Paralichthys olivaceus',confidence:92.4,marketPrice:{minimum:24000,maximum:34000,average:28500,unit:'원/kg',marketName:'부산공동어시장',productionType:'자연산',updatedAt:'예시 업데이트 시간'},captureRegulation:{status:'conditional',minimumSize:'예시 35cm',region:'부산 연안',checkedAt:'예시 기준일',description:'금어기와 최소 포획 체장을 확인해야 합니다.'},edibleStatus:'edible',toxicity:'알려진 독성 없음',characteristics:['몸이 납작하고 두 눈이 한쪽에 있습니다.','모래나 펄 바닥에 몸을 숨기는 습성이 있습니다.'],habitat:'연안의 모래와 펄 바닥',season:'가을부터 겨울',averageSize:'30~60cm',taste:'담백하고 쫄깃한 식감',recommendedCooking:['회','구이','매운탕'],similarSpecies:['도다리','가자미'],warnings:['사진만으로 정확한 어종 판별은 어렵습니다.','식용 전 전문가의 확인을 권장합니다.']};$('analysis-content').innerHTML=`${appState.selectedImageUrl?`<img class="preview" src="${appState.selectedImageUrl}" alt="분석한 물고기 사진">`:''}<h2 class="detail-title">예상 어종: ${r.fishName}</h2>${badge('예시 분석 결과','mock')}${badge('인식 신뢰도 '+r.confidence+'%','green')}<article class="info-card"><h2>핵심 결과</h2><p class="line"><b>예상 시세</b>: ${formatPriceWithUnit(r.marketPrice.average,r.marketPrice.unit)}<br><span class="small">${formatPriceWithUnit(r.marketPrice.minimum,r.marketPrice.unit)} ~ ${formatPriceWithUnit(r.marketPrice.maximum,r.marketPrice.unit)} · ${r.marketPrice.marketName} · ${r.marketPrice.productionType}</span><br>${badge('⚠ 조건부 가능','orange')}${badge('✓ 식용 가능','green')}<br>최소 포획 체장: ${r.captureRegulation.minimumSize}<br>${r.captureRegulation.description}</p></article><article class="info-card"><h2>물고기 기록 저장</h2><p class="small">이름, 점수, 달성 일시를 Firestore에 저장합니다.</p><div class="toolbar"><input id="record-name" class="search-input" maxlength="30" aria-label="기록 이름" placeholder="이름"><input id="record-score" class="search-input" type="number" min="0" max="1000000" aria-label="점수" placeholder="점수"><button id="record-save" class="action" aria-label="물고기 기록 저장" onclick="saveFishRecord('${r.fishName}')">저장</button></div><p id="record-status" class="small" aria-live="polite">달성 일시는 저장 시점으로 async function saveFishRecord(fishName){const name=$('record-name').value.trim(),score=Number($('record-score').value),status=$('record-status'),button=$('record-save');if(!name){status.textContent='이름을 입력해 주세요.';return}if(!Number.isFinite(score)||score<0){status.textContent='0 이상의 점수를 입력해 주세요.';return}button.disabled=true;status.textContent='Firestore에 기록을 저장하고 있어요…';try{if(!await firebaseReady||!firestoreDb||!firestoreApi)throw new Error('SDK_LOAD_FAILED');await firestoreApi.addDoc(firestoreApi.collection(firestoreDb,'fishRecords'),{name,score,fishName,achievedAt:firestoreApi.serverTimestamp(),achievedAtClient:new Date().toISOString()});status.textContent=`저장 완료 · ${name}님의 ${score.toLocaleString('ko-KR')}점 기록이 저장되었습니다.`}catch(error){status.textContent='저장하지 못했습니다. Firestore 데이터베이스 활성화 및 보안 규칙의 쓰기 권한을 확인해 주세요.'}finally{button.disabled=false}}

async function saveMarineData(){const status=$('marine-status'),button=$('marine-save'),fish=latestAnalysis;if(!fish){status.textContent='분석 결과를 먼저 생성해 주세요.';return}button.disabled=true;status.textContent='사진과 해양 정보를 Firebase에 저장하고 있어요…';try{if(!await firebaseReady||!firestoreDb||!storageDb||!firebaseApi)throw new Error('FIREBASE_NOT_READY');let imageUrl=null,imagePath=null;if(appState.selectedImageUrl){const imageBlob=await fetch(appState.selectedImageUrl).then(response=>response.blob());const id=(crypto.randomUUID?crypto.randomUUID():Date.now().toString());imagePath=`fish-images/${id}.jpg`;const uploaded=await firebaseApi.uploadBytes(firebaseApi.ref(storageDb,imagePath),imageBlob,{contentType:imageBlob.type||'image/jpeg'});imageUrl=await firebaseApi.getDownloadURL(uploaded.ref)}const creature=seaCreatures.find(item=>item.name===fish.fishName);const record={savedAt:firebaseApi.serverTimestamp(),savedAtClient:new Date().toISOString(),isMockData:true,seaTemperatures:beaches.map(item=>({name:item.name,location:item.location,temperature:item.temperature,measuredAt:item.measuredAt,source:item.source})),fish:{name:fish.fishName,scientificName:fish.scientificName,confidence:fish.confidence,photoUrl:imageUrl,photoPath:imagePath,habitat:fish.habitat,occurrenceLocations:(creature?.beachIds||[]).map(id=>beaches.find(beach=>beach.id===id)?.name||'정보 확인 필요'),closedSeasons:(creature?.seasonalPeriods||[]).filter(period=>period.type==='closed'),peakSeasons:(creature?.seasonalPeriods||[]).filter(period=>period.type==='peak'),minimumCaptureSize:fish.captureRegulation.minimumSize,captureRegulation:fish.captureRegulation,edibleStatus:fish.edibleStatus,toxicity:fish.toxicity,marketPrice:fish.marketPrice,characteristics:fish.characteristics,season:fish.season}};await firebaseApi.addDoc(firebaseApi.collection(firestoreDb,'marineSnapshots'),record);status.textContent='저장 완료 · 사진과 부산 바다·물고기 정보가 Firebase에 저장되었습니다.'}catch(error){status.textContent='저장하지 못했습니다. Firestore와 Storage를 활성화하고 두 서비스 function makePeriod(name,type,range,label){if(!range)return null;const m=range.match(/(\d+)\/(\d+)-(\d+)\/(\d+)/);return m?period(`${name}-${type}`,type,+m[1],+m[2],+m[3],+m[4],label):null}function peakPeriod(name,range){const m=range.match(/(\d+)월~(\d+)월/);return m?period(`${name}-peak`,'peak',+m[1],1,+m[2],28,'잘 잡히는 시기(참고)'):null}
function applyRegulationData(){regulationSeeds.forEach(([name,category,closed,minimum,peak])=>{const aliases={광어:'넙치(광어)',우럭:'조피볼락(우럭)',오징어:'살오징어'};let creature=seaCreatures.find(item=>item.name===name||aliases[item.name]===name);const periods=[makePeriod(name,'closed',closed,'금어기'),peakPeriod(name,peak)].filter(Boolean);if(creature){creature.minimumCaptureSize=minimum;creature.seasonalPeriods=periods;creature.characteristics=[`${name}은(는) ${peak}에 비교적 잘 잡히는 것으로 알려진 참고 어종입니다.`,`${minimum} 기준과 지역별 포획 규정을 함께 확인해야 합니다.`];creature.warnings=['금어기·체장 기준은 제공된 자료를 반영한 참고 정보입니다.','출조 전 최신 해양수산부·지자체 고시를 확인하세요.']}else{seaCreatures.push({id:`regulated-${name}`,name,scientificName:'학명 정보 확인 필요',category,categoryLabel:category==='fish'?'어류':category==='crustacean'?'갑각류':category==='mollusk'?'연체동물':'해조류·기타',beachIds:beaches.map(b=>b.id),habitat:category==='fish'?'부산 연안·항만 및 수심 변화가 있는 해역':'부산 연안 및 서식 환경 확인 필요',averageSize:'정보 확인 필요',maximumSize:'정보 확인 필요',probability:'계절·해역에 따라 다름',seasonalPeriods:periods,food:'정보 확인 필요',characteristics:[`${name}의 조업기 참고 시기는 ${peak}입니다.`,`서식 위치와 출현량은 수온·조류·해역 환경에 따라 달라집니다.`],minimumCaptureSize:minimum,edibleStatus:'식용 정보 확인 필요',toxicity:'공식 자료 확인 필요',fishingTips:['현장 규정과 입어 가능 구역을 확인하세요.'],warnings:['금어기·체장 기준은 제공된 자료를 반영한 참고 정보입니다.']})}})}
function renderAnalysis(){const r=marineAnalysis;$('analysis-content').innerHTML=`${appState.selectedImageUrl?`<img class="preview" src="${appState.selectedImageUrl}" alt="분석한 물고기 사진">`:''}<h2 class="detail-title">예상 어종: ${r.fishName}</h2>${badge('예시 분석 결과','mock')}${badge('인식 신뢰도 '+r.confidence+'%','green')}<article class="info-card"><h2>핵심 결과</h2><p class="line"><b>예상 시세</b>: ${formatPriceWithUnit(r.marketPrice.average,r.marketPrice.unit)}<br><span class="small">${formatPriceWithUnit(r.marketPrice.minimum,r.marketPrice.unit)} ~ ${formatPriceWithUnit(r.marketPrice.maximum,r.marketPrice.unit)} · ${r.marketPrice.marketName} · ${r.marketPrice.productionType}</span><br>${badge('⚠ 조건부 가능','orange')}${badge('✓ 식용 가능','green')}<br>최소 포획 체장: ${r.captureRegulation.minimumSize}<br>${r.captureRegulation.description}</p></article><article class="info-card"><h2>저장 기능 미사용</h2><p class="small">이 앱은 현재 데이터베이스 연동 없이, 기기에서 바로 확인하는 Mock Data 앱으로 동작합니다.</p></article><article class="info-card"><h2>상세 정보</h2><p class="line">학명: ${r.scientificName}<br>특징: ${r.characteristics.join(' ')}<br>서식지: ${r.habitat}<br>평균 크기: ${r.averageSize}<br>주요 제철: ${r.season}<br>독성: ${r.toxicity}<br>맛과 식감: ${r.taste}<br>추천 조리법: ${r.recommendedCooking.join(', ')}<br>비슷한 어종: ${r.similarSpecies.join(', ')}<br>확인 기준일: ${r.captureRegulation.checkedAt}</p></article><div class="warning-box">사진 분석 결과는 참고용입니다. 비슷하게 생긴 어종이나 독성 어종이 있을 수 있으므로 식용 전 전문가 또는 공식 기관의 확인이 필요합니다. 포획 가능 여부는 최신 수산자원 관련 규정과 지역별 제한을 다시 확인해 주세요.</div><div class="button-row"><button class="action secondary" onclick="showScreen('camera-screen')">다른 물고기 분석하기</button><button class="action" onclick="showScreen('home-screen')">홈으로 돌아가기</button></div>`}
function categoryIcon(category){return category==='fish'?'🐟':category==='crustacean'?'🦀':category==='mollusk'?'🐚':'🌿'}
function periodHTML(p){const inPeriod=isDateWithinRecurringPeriod(getKoreanToday(),p.startMonth,p.startDay,p.endMonth,p.endDay),isClosed=p.type==='closed';const label=isClosed?'금어기':'잘 잡히는 시기';const state=isClosed?(inPeriod?'⛔ 현재 포획 금지':'✓ 현재 금어기 아님'):(inPeriod?'🐟 지금 잘 잡히는 시기':'○ 현재 주요 조업기가 아님');const badgeColor=inPeriod?(isClosed?'red':'green'):(isClosed?'green':'red'),textClass=inPeriod?(isClosed?'active-closed':'active-peak'):(isClosed?'active-peak':'out'),cardColor=badgeColor==='green'?'state-green':'state-red';return `<div class="period-card ${cardColor}"><div class="period-head"><span>${isClosed?'⛔':'🎣'} ${label}</span>${badge(inPeriod?'현재 해당':'기간 외',badgeColor)}</div><div class="period-date">${p.startMonth}월 ${p.startDay}일 ~ ${p.endMonth}월 ${p.endDay}일</div><div class="period-status ${textClass}">${state}</div></div>`}
function renderSeaCreatures(){try{renderBeachSelectors();const filters=[['all','전체'],['fish','어류'],['crustacean','갑각류'],['mollusk','연체동물'],['closed','현재 금어기'],['peak','현재 잘 잡히는 생물'],['spring','봄'],['summer','여름'],['fall','가을'],['winter','겨울']];$('creature-chips').innerHTML=filters.map(([value,name])=>`<button class="chip ${value===appState.selectedCreatureCategory?'active':''}" aria-pressed="${value===appState.selectedCreatureCategory}" onclick="appState.selectedCreatureCategory='${value}';renderSeaCreatures()">${name}</button>`).join('');let list=seaCreatures.filter(item=>item.beachIds.includes(appState.selectedBeachId)),filter=appState.selectedCreatureCategory;if(['fish','crustacean','mollusk'].includes(filter))list=list.filter(item=>item.category===filter);if(['closed','peak'].includes(filter))list=list.filter(item=>item.seasonalPeriods.some(p=>p.type===filter&&isDateWithinRecurringPeriod(getKoreanToday(),p.startMonth,p.startDay,p.endMonth,p.endDay)));$('creature-list').innerHTML=list.length?list.map(item=>`<article class="info-card" role="button" tabindex="0" aria-label="${item.name} 상세 보기" onclick="openCreature('${item.id}')" onkeydown="if(event.key==='Enter')openCreature('${item.id}')"><div class="row"><div><h2 class="creature-title"><span class="category-icon category-${item.category}">${categoryIcon(item.category)}</span>${item.name}</h2><div class="small">${item.categoryLabel} · 출현 가능성 ${item.probability}</div></div>${badge('참고 정보','mock')}</div><p class="line">${item.habitat} · 평균 ${item.averageSize}<br>${item.characteristics[0]}</p>${item.seasonalPeriods.map(periodHTML).join('')||'<span class="small">기간 정보 확인 필요</span>'}</article>`).join(''):`<div class="empty"><b>🐠</b>조건에 맞는 생물이 없습니다.<p><button class="action" onclick="appState.selectedCreatureCategory='all';renderSeaCreatures()">필터 초기화</button></p></div>`}catch(error){$('creature-list').innerHTML='<div class="empty">⚠️ 생물 정보를 표시하지 못했습니다.</div>'}}
function openCreature(id){appState.selectedCreatureId=id;const creature=seaCreatures.find(item=>item.id===id),beach=beaches.find(item=>item.id===appState.selectedBeachId);$('creature-detail').innerHTML=`<h2 class="detail-title"><span class="category-icon category-${creature.category}">${categoryIcon(creature.category)}</span>${creature.name}</h2>${badge('참고 정보','mock')}<p class="subtitle">${creature.scientificName}</p><article class="info-card"><h2>생물 정보</h2><p class="line">분류: ${creature.categoryLabel}<br>선택한 바다: ${beach.name}<br>출현 가능성: ${creature.probability}<br>주요 서식지: ${creature.habitat}<br>평균/최대 크기: ${creature.averageSize} / ${creature.maximumSize}<br>주요 먹이: ${creature.food}<br>특징: ${creature.characteristics.join(' ')}</p></article><article class="info-card"><h2>기간과 포획 안내</h2>${creature.seasonalPeriods.map(periodHTML).join('')||'<p class="line">기간 정보 확인 필요</p>'}<p class="line">최소 포획 체장: ${creature.minimumCaptureSize}<br>식용 가능 여부: ${creature.edibleStatus}<br>독성 여부: ${creature.toxicity}<br>낚시 팁: ${creature.fishingTips.join(' ')}</p></article><div class="warning-box">${creature.warnings.join(' ')} 금어기가 아니더라도 최소 포획 체장과 지역 규정에 따라 제한될 수 있습니다.</div><p class="notice">생물의 출현 시기와 분포는 수온, 날씨, 조류 및 주변 환경에 따라 달라질 수 있습니다.</p>`;showScreen('sea-life-detail-screen')}
function activateScreen(id){appState.currentScreen=id;document.querySelectorAll('.screen').forEach(screen=>screen.classList.toggle('active',screen.id===id));window.scrollTo(0,0);if(id==='sea-life-screen')renderSeaCreatures();if(id==='camera-screen')renderCamera();if(id==='market-price-screen')renderMarketPrices()}
function showScreen(id){if(appState.currentScreen!==id){appState.history.push(appState.currentScreen);history.pushState({oneulScreen:id},'',location.href)}activateScreen(id)}
function goBack(){const previous=appState.history.pop()||'home-screen';activateScreen(previous);history.replaceState({oneulScreen:previous},'',location.href)}
function initApp(){applyRegulationData();renderTemperatures();renderBeachSelectors();renderSeaCreatures();renderMarketSelectors();renderMarketPrices();history.replaceState({oneulScreen:'home-screen'},'',location.href);activateScreen('home-screen');window.addEventListener('popstate',event=>{const screen=event.state&&event.state.oneulScreen;if(screen){activateScreen(screen)}else{history.pushState({oneulScreen:'home-screen'},'',location.href);activateScreen('home-screen')}})}document.addEventListener('DOMContentLoaded',initApp);
</script></body></html>
